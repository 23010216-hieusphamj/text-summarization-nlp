# Thí nghiệm tùy chọn (D10): T5-small tinh chỉnh trên train GOV.UK
run_name: t5small_govuk_in512
kind: t5
model_name: t5-small
source: govuk
max_input: 512            # đã gồm <s>, </s> (D7)
max_target: 64
preprocess_config: configs/preprocess.yaml
data_dir: data/processed/clean      # trên Colab: --data_dir /content/drive/MyDrive/nlp_summarization/clean
cache_dir: data/processed/hf_cache  # trên Colab: --cache_dir /content/drive/MyDrive/nlp_summarization/hf_cache

# Giá trị mặc định ban đầu theo D10 (đề xuất, chưa kiểm chứng; chỉnh sau smoke test). Chọn trên validation, không dùng test.
train:
  seed: 42
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 16            # mỗi micro-batch
  grad_accum: 1             # batch hiệu dụng 16
  epochs: 8                 # GOV.UK chỉ 3.102 mẫu (194 bước/epoch): 8 epoch = 1.552 bước (A đạt S tốt nhất sau khoảng 2.500 bước); epoch chọn trên validation theo S
  warmup_ratio: 0.06
  clip_norm: 1.0
  amp: false                # T5-small chạy fp32: fp16 với T5 hay gây NaN (kinh nghiệm chung, chưa kiểm chứng ở đây)
  patience: 3               # dừng sớm nếu S không cải thiện (>= select_tol) sau 3 epoch
  log_every: 50             # ghi loss theo bước tối ưu mỗi 50 bước
  save_every_steps: 0       # epoch ngắn nên chỉ lưu cuối epoch
  eval_batch_size: 32
best_by: S                  # chọn epoch theo S = TB(R1,R2,Rlsum) trên tập con validation (D10); "val_loss" để so sánh
val_rouge_n: 300            # ROUGE theo epoch trên 300 mẫu validation cố định
val_gen:                    # giải mã ban đầu (D10), khai tường minh để không dính mặc định ẩn của mô hình
  num_beams: 4
  max_length: 64
  min_length: 0
  length_penalty: 1.0
  no_repeat_ngram_size: 3
  early_stopping: false
output:
  log_dir: results/logs
  ckpt_dir: checkpoints     # đã bị .gitignore; trên Colab trỏ ra Drive bằng --ckpt_dir
